alarm_small:
  type: custom:button-card
  template: setup
  show_state: true
  styles:
    grid:
      - grid-template-areas: |
          'n i'
          's i'
          'tile tile'
      - grid-template-rows: min-content min-content
      - grid-template-columns: 1fr 20px
    card:
      - padding: 20px
      - height: 130px
      - border-radius: 30px
    icon:
      - justify-self: end
      - width: 20px
      - color: var(--contrast18)
    name:
      - justify-self: start
      - align-self: start
      - color: var(--contrast18)
      - font-weight: 500
      - font-size: 11px
      - z-index: 1
    state:
      - justify-self: start
      - align-self: start
      - color: var(--contrast15)
      - font-wight: 500
      - font-size: 11px
      - z-index: 1
    custom_fields:
      label:
        - width: 100%
        - margin-top: 20px
  custom_fields:
    tile:
      card:
        type: tile
        entity: "[[[return entity.entity_id]]]"
        features:
          - type: alarm-modes
            modes:
              - armed_home
              - armed_night
              - armed_away
              - disarmed
        card_mod:
          style:
            .: |
              ha-card .content {
                display: none !important;
              }
              ha-card {
                background: transparant;
                border-radius: 0px;
              }
              ha-card.active{
                height: 40px;
              }
            ha-tile-container $: |
              .content {
                display: none !important;
              }
            .features hui-alarm-modes-tile-feature $: |
              .container{
                padding: 0px !important;
              }
            .features hui-alarm-modes-tile-feature $ .containter ha-control0select $ .container:
              |
              .option{
                background-color: transparent !important;
                border-radius: 13px !important;
              }
            hui-card-features $:
              hui-alarm-modes-card-feature $:
                ha-control-select$: |
                  .container {
                    color: var(--contrast10) !important;
                    --control-select-color: var(--green) !important;
                  }
