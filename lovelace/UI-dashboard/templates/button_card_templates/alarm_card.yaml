alarm_score:
  template: setup
  variables:
    sensor: sensor.security_score
  show_state: true
  show_label: true
  label: |
    [[[
      var score = states[variables.sensor].state;
      var total = 100;
      return `
      ${score}<span style="font-size:0.4em; opacity: 0.7">/${parseFloat(total).toFixed(0)}</span>
      `
    ]]]
  styles:
    grid:
      - grid-template-areas: |
          'n i'
          's i'
          'l l'
          'details details'
          'tile tile'
      - grid-template-rows: min-content min-content min-content 1fr min-content
      - grid-template-columns: 1fr 20px
    card:
      - padding: 20px
      - height: 300px
      - border-radius: 30px
    icon:
      - justify-self: end
      - width: 20px
      - color: var(--contrast18)
    name:
      - justify-self: start
      - align-self: start
      - color: var(--contrast18)
      - font-weight: 500
      - font-size: 11px
      - z-index: 1
    state:
      - justify-self: start
      - align-self: start
      - color: var(--contrast15)
      - font-wight: 500
      - font-size: 11px
      - z-index: 1
    label:
      - color: |
          [[[
            const score = parseInt(states[variables.sensor].state);
            if(score >= 90) return "green";
            if(score < 50) return "red";
            return "orange";
          ]]]
      - font-weight: 100
      - font-size: 60px
      - z-index: 0
  custom_fields:
    details:
      card:
        type: custom:button-card
        styles:
          styles: null
          grid:
            - grid-template-areas: "'one two' 'three four'"
            - grid-template-columns: 1fr 1fr
            - grid-template-rows: 1fr 1fr
          card:
            - background: none
            - padding: 10px 20px
        custom_fields:
          one:
            card:
              type: custom:button-card
              icon: mdi:security
              show_label: true
              label: |
                [[[
                  return states[variables.sensor].attributes.alarm_score
                ]]]
              styles:
                grid:
                  - grid-template-areas: "'i l'"
                  - grid-template-columns: 50px 1fr
                card:
                  - background: none
                  - box-shadow: none
                label:
                  - justify-self: start
                  - color: var(--contrast15)
                  - font-size: 13px
                icon:
                  - color: var(--contrast15)
          two:
            card:
              type: custom:button-card
              icon: mdi:window-open
              show_label: true
              label: |-
                [[[
                  return states[variables.sensor].attributes.window_score
                ]]]
              styles:
                grid:
                  - grid-template-areas: "'i l'"
                  - grid-template-columns: 50px 1fr
                card:
                  - background: none
                  - box-shadow: none
                label:
                  - justify-self: start
                  - color: var(--contrast15)
                  - font-size: 13px
                icon:
                  - color: var(--contrast15)
          three:
            card:
              type: custom:button-card
              icon: mdi:door
              show_label: true
              label: |
                [[[
                  return states[variables.sensor].attributes.door_score
                ]]]
              styles:
                grid:
                  - grid-template-areas: "'i l'"
                  - grid-template-columns: 50px 1fr
                card:
                  - background: none
                  - box-shadow: none
                label:
                  - justify-self: start
                  - color: var(--contrast15)
                  - font-size: 13px
                icon:
                  - color: var(--contrast15)
          four:
            card:
              type: custom:button-card
              icon: mdi:security
              show_label: true
              label: |-
                [[[
                  return states[variables.sensor].attributes.door_score
                ]]]
              styles:
                grid:
                  - grid-template-areas: "'i l'"
                  - grid-template-columns: 50px 1fr
                card:
                  - background: none
                  - box-shadow: none
                label:
                  - justify-self: start
                  - color: var(--contrast15)
                  - font-size: 13px
                icon:
                  - color: var(--contrast15)
    tile:
      card:
        type: tile
        entity: "[[[return entity.entity_id]]]"
        features:
          - type: alarm-modes
            modes:
              - armed_home
              - armed_night
              - armed_away
              - disarmed
        card_mod:
          style:
            .: |
              ha-card .content {
                display: none !important;
              }
              ha-card {
                background: transparant;
                border-radius: 0px;
              }
              ha-card.active{
                height: 40px;
              }
            ha-tile-container $: |
              .content {
                display: none !important;
              }
            .features hui-alarm-modes-tile-feature $: |
              .container{
                padding: 0px !important;
              }
            .features hui-alarm-modes-tile-feature $ .containter ha-control0select $ .container:
              |
              .option{
                background-color: transparent !important;
                border-radius: 13px !important;
              }
            hui-card-features $:
              hui-alarm-modes-card-feature $:
                ha-control-select$: |
                  .container {
                    color: var(--contrast10) !important;
                    --control-select-color: var(--green) !important;
                  }
