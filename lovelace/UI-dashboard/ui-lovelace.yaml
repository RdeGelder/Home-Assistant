kiosk_mode:
  mobile_settings:
    ignore_entity_settings: false
  non_admin_settings:
    hide_header: true
    hide_menubutton: true
    hide_sidebar: false
    ignore_entity_settings: false
  entity_settings:
    - entity:
        input_boolean.kiosk_mode: "on"
      hide_header: true
      hide_sidebar: true
      kioask: true
    - entity:
        input_boolean.kiosk_mode: "off"
      hide_header: false
      hide_sidebar: false

  #!include templates/kiosk.yaml

# region templates
button_card_templates: !include_dir_merge_named templates/button_card_templates/
decluttering_templates: !include templates/decluttering_templates.yaml

views:
  ################################################################################
  #region: main dashboard
  ################################################################################
  - title: home
    header: !include header/header_card.yaml
    badges: !include header/header_badges.yaml
    type: sections
    max_columns: 3
    path: home
    dense_section_placement: false
    subview: false
    theme: rounded-bubble
    sections:
      # region mobile user
      - type: grid
        visibility:
          - condition: screen
            media_query: "(min-width: 0px) and (max-width: 767px)"
        cards:
          - type: vertical-stack
            cards:
              - type: custom:button-card
                template: custom_card_user

      - type: grid
        column_span: 2
        cards:
          # region desktop map
          - type: vertical-stack
            cards:
              - type: heading
                heading: Map
                heading_style: title
                icon: mdi:map-marker-account
                badges:
                  - type: entity
                    show_state: false
                    show_icon: true
                    entity: person.ruben
                    icon: mdi:face-agent
                    color: green
                    tap_action:
                      action: more-info
                  - type: entity
                    show_state: false
                    show_icon: true
                    entity: person.marit
                    icon: mdi:face-woman
                    color: purple
                    tap_action:
                      action: more-info
                  - type: entity
                    show_state: false
                    show_icon: true
                    entity: person.evi
                    icon: mdi:baby
                    color: brown
                    tap_action:
                      action: more-info
                  - type: entity
                    show_state: false
                    show_icon: true
                    entity: person.guest
                    icon: mdi:account-group
                    color: orange
                    tap_action:
                      action: more-info
